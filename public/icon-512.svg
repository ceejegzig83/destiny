<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  
  <!-- FD Crest Shield / Emblem -->
  <g filter="url(#shadow)">
    <!-- Monogram Circle -->
    <circle cx="256" cy="220" r="130" fill="#292524" stroke="url(#gold)" stroke-width="8"/>
    
    <!-- Stylized FD Monogram -->
    <text x="256" y="258" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#gold)" letter-spacing="-4">FD</text>
  </g>
  
  <!-- Brand Label -->
  <text x="256" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#fef3c7" letter-spacing="3">FLOURISH DESTINY</text>
  <text x="256" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#fbbf24" letter-spacing="6">COLLECTION</text>
</svg>
